name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install plugin dependencies
        run: npm ci

      - name: Create shared temporary directory
        run: |
          test -d /tmp/opencode || mkdir -m 700 /tmp/opencode
          test -w /tmp/opencode

      - name: Install lint tools used by acceptance tests
        run: |
          bash scripts/setup-ci-linters.sh
          echo "$GITHUB_WORKSPACE/.ci-linters/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.ci-linters/venv/bin" >> "$GITHUB_PATH"

      - name: Install OpenCode host locally
        run: npm ci --prefix .github/tooling/opencode-host

      - name: Run unit tests
        run: npm run test:unit

      - name: Run sidebar UI unit tests
        env:
          OATS_REQUIRE_SIDEBAR_UI: "1"
        run: npm run test:unit:sidebar-ui

      - name: Run real-host session contract test
        env:
          OATS_OPENCODE: ${{ github.workspace }}/.github/tooling/opencode-host/node_modules/.bin/opencode
        run: npm run test:real-host

      - name: Run automated test suite
        env:
          OATS_OPENCODE: ${{ github.workspace }}/.github/tooling/opencode-host/node_modules/.bin/opencode
        run: npm run test:features

  lint-markdown:
    name: Lint Markdown Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: node scripts/ci-lint.js markdownlint

  lint-yaml-and-workflows:
    name: Lint YAML Configurations and Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint tools
        run: |
          bash scripts/setup-ci-linters.sh
          echo "$GITHUB_WORKSPACE/.ci-linters/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.ci-linters/venv/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: node scripts/ci-lint.js actionlint

      - name: Run yamllint
        run: node scripts/ci-lint.js yamllint


  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: node scripts/ci-lint.js shellcheck

  successful-ci:
    name: Successful CI
    needs:
      - test
      - lint-markdown
      - lint-yaml-and-workflows
      - lint-shell
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate aggregate prerequisite conclusions
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "CI verification failed: one or more prerequisite jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "CI verification passed: all prerequisite test and lint check jobs succeeded."
          exit 0
