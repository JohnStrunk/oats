name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install plugin dependencies
        run: npm ci

      - name: Install OpenCode host locally
        run: npm ci --prefix .github/tooling/opencode-host

      - name: Install test dependencies
        run: python -m pip install behave==1.3.3 PyYAML==6.0.3 json5==0.17.3

      - name: Run unit tests
        run: python -m unittest discover -s features/tests

      - name: Run automated test suite
        env:
          OATS_OPENCODE: ${{ github.workspace }}/.github/tooling/opencode-host/node_modules/.bin/opencode
        run: python -m behave

  lint-markdown:
    name: Lint Markdown Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  lint-yaml-and-workflows:
    name: Lint YAML Configurations and Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Run yamllint
        run: |
          pipx run yamllint .


  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  successful-ci:
    name: Successful CI
    needs:
      - test
      - lint-markdown
      - lint-yaml-and-workflows
      - lint-shell
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate aggregate prerequisite conclusions
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "CI verification failed: one or more prerequisite jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "CI verification passed: all prerequisite test and lint check jobs succeeded."
          exit 0
